<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Plan</title>
  <meta name="description" content="Ganzkörper-Trainingsplan mit Tracking und automatischer Progression">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gym Plan">
  <link rel="apple-touch-icon" href="icons/app-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar" id="navbar">
    <button class="nav-back" id="nav-back" data-action="nav" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4.5 7.5 12l7.5 7.5"/></svg><span></span>
    </button>
    <div class="nav-title" id="nav-title"></div>
    <button class="nav-action" id="nav-action" hidden></button>
  </header>

  <main id="view"></main>

  <div id="rest" class="rest" role="timer">
    <div class="rest-inner">
      <div class="rest-text"><span class="rest-label">Pause</span><span class="rest-time" id="rest-time">1:30</span></div>
      <button class="rest-btn" data-action="rest-add">+30 s</button>
      <button class="rest-btn primary" data-action="rest-skip">Weiter</button>
    </div>
    <div class="rest-track"><div class="rest-fill" id="rest-fill"></div></div>
  </div>

  <nav class="tabbar">
    <button data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M3.5 9.5v5M17.5 6.5v11M20.5 9.5v5M6.5 12h11"/></svg>Training</button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v3.5M16 3v3.5"/></svg>Verlauf</button>
    <button data-tab="progress">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 17 9 11.5l3.5 3.5L20.5 7M15 7h5.5v5.5"/></svg>Fortschritt</button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6.5h10M9.5 12h10M9.5 17.5h10"/><circle cx="5" cy="6.5" r=".9" fill="currentColor"/><circle cx="5" cy="12" r=".9" fill="currentColor"/><circle cx="5" cy="17.5" r=".9" fill="currentColor"/></svg>Plan</button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="7.8" cy="12" r=".6" fill="currentColor"/><circle cx="12" cy="12" r=".6" fill="currentColor"/><circle cx="16.2" cy="12" r=".6" fill="currentColor"/></svg>Mehr</button>
  </nav>

  <div id="sheet" class="sheet"><div class="sheet-card" id="sheet-body"></div></div>
  <div id="toast" class="toast" role="status"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="figures.js"></script>
  <script src="ui.js"></script>
</body>
</html>
