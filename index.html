<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gym Plan</title>
  <meta name="description" content="Ganzkörper-Trainingsplan mit Tracking und automatischer Progression">
  <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gym Plan">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><h1 id="title">Training</h1></header>

  <main id="view"></main>

  <div id="rest" class="rest">
    <div class="rest-fill" id="rest-fill"></div>
    <div class="rest-inner">
      <span class="rest-label">Pause</span>
      <span class="rest-time" id="rest-time">1:30</span>
      <button class="btn small" data-action="rest-add">+30 s</button>
      <button class="btn small primary" data-action="rest-skip">Weiter</button>
    </div>
  </div>

  <nav class="tabbar">
    <button data-tab="home"><span class="ico">🏋️</span>Training</button>
    <button data-tab="history"><span class="ico">📅</span>Verlauf</button>
    <button data-tab="progress"><span class="ico">📈</span>Fortschritt</button>
    <button data-tab="plan"><span class="ico">📋</span>Plan</button>
    <button data-tab="settings"><span class="ico">⚙️</span>Mehr</button>
  </nav>

  <div id="sheet" class="sheet"><div class="sheet-card" id="sheet-body"></div></div>
  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
